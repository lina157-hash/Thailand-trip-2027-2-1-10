name: preview-photos
on:
  push:
    branches: [claude/project-thread-73tzlq]
    paths: [.github/preview/photo-queries.json]
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && python3 .github/preview/openverse_search.py
      - run: |
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add .preview && git commit -m "暫存照片候選" && git pull --rebase origin claude/project-thread-73tzlq && git push origin HEAD:claude/project-thread-73tzlq
