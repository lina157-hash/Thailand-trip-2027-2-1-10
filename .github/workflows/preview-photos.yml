name: preview-photos
on:
  push:
    branches: [claude/project-thread-73tzlq]
    paths: [.github/preview/photo-queries.json]
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - run: python3 .github/preview/commons_search.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A .preview && git commit -m "暫存照片候選" && git pull --rebase -q && git push
