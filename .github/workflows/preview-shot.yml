name: preview-shot
on:
  push:
    branches: [claude/project-thread-73tzlq]
    paths: [.github/workflows/preview-shot.yml]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      - run: npm i --no-save playwright@1.48.2
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - run: |
          rm -rf .preview; mkdir -p .preview
          (python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          node .github/preview/shot.mjs
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A .preview && git commit -m "暫存地圖預覽圖" && git push
