name: preview-shot
on:
  push:
    branches: [claude/project-thread-73tzlq]
    paths: [.github/preview/shots.mjs]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p .preview/shots
          node .github/preview/shots.mjs
      - run: |
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add .preview/shots && git commit -m "暫存預覽截圖" && git pull --rebase origin claude/project-thread-73tzlq && git push origin HEAD:claude/project-thread-73tzlq
